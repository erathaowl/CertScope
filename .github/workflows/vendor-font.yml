name: Vendor pinned editor font

on:
  push:
    branches: [main]
    paths:
      - 'scripts/vendor-font.py'
      - '.github/workflows/vendor-font.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Download pinned JetBrains Mono Nerd Font and license
        run: uv run --no-project scripts/vendor-font.py
      - name: Commit vendored font resources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/certscope/assets
          if ! git diff --cached --quiet; then
            git commit -m "Vendor JetBrains Mono Nerd Font v3.5.1"
            git push origin HEAD:main
          fi
