name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Git reference to build
        required: false
        type: string

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - run: uv sync --group dev
      - name: Ensure pinned font is available
        run: uv run --no-project scripts/vendor-font.py
      - name: Core tests
        run: uv run pytest -q --ignore=tests/test_gui.py
      - name: GUI smoke tests (Windows)
        if: runner.os == 'Windows'
        run: uv run pytest -q tests/test_gui.py
      - run: uv run ruff check .
  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv run --no-project scripts/vendor-font.py
      - run: .\scripts\build-windows.ps1
        shell: pwsh
        env:
          CERTSCOPE_VERSION: ${{ inputs.source_ref }}
      - uses: actions/upload-artifact@v4
        with:
          name: CertScope-Windows
          path: |
            dist/CertScope.exe
            dist/CertScope-CLI.exe
