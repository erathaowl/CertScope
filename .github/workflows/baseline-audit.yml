name: Temporary baseline executable audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baseline-audit.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --group dev
      - name: Retrieve unchanged v1.3.0 Windows release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          New-Item -Path baseline -ItemType Directory -Force | Out-Null
          gh release download v1.3.0 --repo $env:GITHUB_REPOSITORY --dir baseline --pattern "certscope-windows.zip" --pattern "certscope-cli-windows.zip"
      - name: Inspect archived executables
        shell: pwsh
        run: uv run python scripts/size_report.py --baseline-dir baseline --summary $env:GITHUB_STEP_SUMMARY
