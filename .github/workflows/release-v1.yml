name: Release CertScope 1.0.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch verified Windows executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 43418270689 --repo "${{ github.repository }}" --name CertScope-Windows --dir dist
          test -s dist/CertScope.exe
          test -s dist/CertScope-CLI.exe
      - name: Publish immutable v1.0.0 release from verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 09505a33f6e26d24caa19462eadc18ad4a1e6967
        run: |
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; no changes made."
            exit 0
          fi
          gh release create v1.0.0             dist/CertScope.exe dist/CertScope-CLI.exe             --repo "${{ github.repository }}"             --target "$TARGET_SHA"             --title "CertScope 1.0.0"             --notes "Stable baseline before remote certificate acquisition and automatic input analysis. Includes the Windows GUI and CLI, certificate chain verification, SQLite trust store, and configurable editors."             --latest
