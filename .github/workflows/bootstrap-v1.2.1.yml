name: Bootstrap v1.2.1 tag and release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-v1.2.1.yml

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable v1.2.1 tag at version-bump commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 4dd46a3537bced8401dfec1bcb81cd36900910db
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" >/dev/null 2>&1; then
            echo "v1.2.1 already exists, refusing to move it" >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v1.2.1" -f sha="$TARGET_SHA" --silent
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" --jq '.object.sha'
      - name: Dispatch generic release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" \
            --ref main --field tag=v1.2.1
