name: One-time Windows release asset migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-windows-assets.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [v1.0.0, v1.1.0, v1.2.0, v1.2.1]
    steps:
      - uses: actions/checkout@v4
      - name: Replace historical Windows EXE assets with ZIP files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"

          if ! grep -Fxq 'CertScope.exe' <<< "$assets"; then
            if grep -Fxq 'certscope-windows.zip' <<< "$assets" &&
               grep -Fxq 'certscope-cli-windows.zip' <<< "$assets" &&
               ! grep -Fxq 'CertScope-CLI.exe' <<< "$assets"; then
              echo "Release $TAG was already migrated."
              exit 0
            fi
            echo "Unexpected release asset state for $TAG" >&2
            exit 1
          fi
          grep -Fxq 'CertScope-CLI.exe' <<< "$assets"

          mkdir -p dist
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.exe' \
            --dir dist

          test -s dist/CertScope.exe
          test -s dist/CertScope-CLI.exe
          mv dist/CertScope.exe dist/certscope.exe
          mv dist/CertScope-CLI.exe dist/certscope-cli.exe

          PYTHONPATH=src python -m certscope.windows_package

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          for filename, executable in (
              ("certscope-windows.zip", "certscope.exe"),
              ("certscope-cli-windows.zip", "certscope-cli.exe"),
          ):
              with ZipFile(Path("dist") / filename) as archive:
                  assert archive.namelist() == [executable]
                  assert archive.testzip() is None
                  assert archive.read(executable) == (Path("dist") / executable).read_bytes()
          PY

          gh release upload "$TAG" \
            dist/certscope-windows.zip \
            dist/certscope-cli-windows.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          grep -Fxq 'certscope-windows.zip' <<< "$assets"
          grep -Fxq 'certscope-cli-windows.zip' <<< "$assets"

          gh release delete-asset "$TAG" 'CertScope.exe' --yes --repo "$GITHUB_REPOSITORY"
          gh release delete-asset "$TAG" 'CertScope-CLI.exe' --yes --repo "$GITHUB_REPOSITORY"
          echo "Migrated original EXE binaries of $TAG into lowercase ZIP packages."
