name: One-time refresh v1.2.1 release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-v1.2.1.yml

permissions:
  contents: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9261ce914f1eef154510e24ab3343f18f3799643
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - name: Retrieve Windows executables built from this exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9261ce914f1eef154510e24ab3343f18f3799643"
          mkdir -p dist
          gh run download 43477161599 --repo "$GITHUB_REPOSITORY" --name CertScope-Windows --dir dist
          test -s dist/certscope.exe
          test -s dist/certscope-cli.exe
          test -s dist/certscope-windows.zip
          test -s dist/certscope-cli-windows.zip
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          for archive, filename in (
              ("certscope-windows.zip", "certscope.exe"),
              ("certscope-cli-windows.zip", "certscope-cli.exe"),
          ):
              with ZipFile(Path("dist") / archive) as package:
                  assert package.namelist() == [filename]
                  assert package.read(filename) == (Path("dist") / filename).read_bytes()
          PY
      - name: Build tagged source ZIP and matching wheel
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --prefix="CertScope-v1.2.1/" HEAD > dist/CertScope-v1.2.1-source.zip
          uv build --wheel --out-dir dist
          test -s dist/certscope-1.2.1-py3-none-any.whl
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from tomllib import loads

          assert loads(Path("pyproject.toml").read_text())["project"]["version"] == "1.2.1"
          with ZipFile("dist/CertScope-v1.2.1-source.zip") as source:
              assert "CertScope-v1.2.1/src/certscope/windows_package.py" in source.namelist()
              assert "CertScope-v1.2.1/.github/workflows/release.yml" in source.namelist()
          with ZipFile("dist/certscope-1.2.1-py3-none-any.whl") as wheel:
              assert wheel.testzip() is None
          PY
      - name: Move tag to current stable commit and replace all release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 9261ce914f1eef154510e24ab3343f18f3799643
          OLD_SHA: 4dd46a3537bced8401dfec1bcb81cd36900910db
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" --jq '.object.sha')"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            [[ "$actual" == "$OLD_SHA" ]] || {
              echo "Unexpected tag SHA: $actual" >&2
              exit 1
            }
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v1.2.1" \
              -f sha="$TARGET_SHA" -F force=true --silent
          fi
          gh release upload v1.2.1 \
            dist/certscope-windows.zip dist/certscope-cli-windows.zip \
            dist/CertScope-v1.2.1-source.zip \
            dist/certscope-1.2.1-py3-none-any.whl \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit v1.2.1 --repo "$GITHUB_REPOSITORY" \
            --notes "Reissued v1.2.1 from verified commit 9261ce914f1eef154510e24ab3343f18f3799643. Includes CLI --version and improved --help, lowercase Windows executable names, ZIP-packaged GUI and CLI, refreshed source archive and Python wheel."
      - name: Verify release points to the new revision with complete assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.2.1" --jq '.object.sha')" = "9261ce914f1eef154510e24ab3343f18f3799643"
          assets="$(gh release view v1.2.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)"
          expected="$(printf '%s\n' \
            CertScope-v1.2.1-source.zip \
            certscope-1.2.1-py3-none-any.whl \
            certscope-cli-windows.zip \
            certscope-windows.zip | sort)"
          if [[ "$assets" != "$expected" ]]; then
            echo "Unexpected release assets:" >&2
            echo "$assets" >&2
            exit 1
          fi
          echo "$assets"
