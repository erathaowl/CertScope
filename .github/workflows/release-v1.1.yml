name: Release CertScope 1.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-v1.1.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch verified Windows executables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 43428040124 --repo "${{ github.repository }}" --name CertScope-Windows --dir dist
          test -s dist/CertScope.exe
          test -s dist/CertScope-CLI.exe
      - name: Publish CertScope v1.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 37dd0658580ae5e650c07fd9a8302967261ba0e7
        run: |
          if gh release view v1.1.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v1.1.0 already exists; no changes made."
            exit 0
          fi
          gh release create v1.1.0 \
            dist/CertScope.exe dist/CertScope-CLI.exe \
            --repo "${{ github.repository }}" \
            --target "$TARGET_SHA" \
            --title "CertScope 1.1.0" \
            --notes "CertScope 1.1.0 adds vertically resizable input and result panels, untrusted TLS certificate-chain retrieval from an HTTPS/TLS URL with automatic verification, and automatic GUI analysis of one filename, URL, or PEM argument. Includes the windowed Windows GUI and the separate console CLI. Built from tested commit 37dd065." \
            --latest
