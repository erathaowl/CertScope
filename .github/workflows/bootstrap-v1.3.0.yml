name: Bootstrap CertScope v1.3.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-v1.3.0.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable v1.3.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: da15474ba219b07364d7f8f13bca1dbc8d59daad
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3.0" >/dev/null 2>&1; then
            echo "Tag v1.3.0 already exists; refusing to replace it" >&2
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v1.3.0" -f sha="$TARGET_SHA" --silent
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.3.0" --jq '.object.sha')" = "$TARGET_SHA"
      - name: Start the standard release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" \
            --ref main --field tag=v1.3.0
